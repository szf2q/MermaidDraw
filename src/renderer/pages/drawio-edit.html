<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<title>drawio在线可视化编辑</title>
	<style>
		html, body {
			margin: 0;
			height: 100%;
			background: #ffffff;
			overflow: hidden;
			font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
		}
		#frame {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			border: 0;
			background: #ffffff;
		}
		#status {
			position: absolute;
			left: 50%;
			top: 50%;
			z-index: 2;
			max-width: 80%;
			padding: 12px 18px;
			transform: translate(-50%, -50%);
			background: #ffffff;
			border: 1px solid #e5e6eb;
			border-radius: 6px;
			box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
			color: #4e5969;
			font-size: 13px;
			line-height: 1.6;
			text-align: center;
		}
		[hidden] {
			display: none !important;
		}
	</style>
</head>
<body>
	<iframe id="frame" title="draw.io在线编辑器" allow="clipboard-read; clipboard-write"></iframe>
	<div id="status">正在加载 draw.io 在线编辑器…</div>
	<script src="drawio-edit.js"></script>
</body>
</html>
